<!doctype html>
<html><head><meta charset="utf-8"><title>three.js extruded mark</title>
<style>html,body{margin:0;height:100%;background:#0b1020;overflow:hidden}canvas{display:block}</style></head><body>
<!-- Starter: a 3D mark (an extruded shape) that flips in, with a light that runs across its bevel. Replace MARK_PATH with your own mark.
     Needs:  video-monk libs --add three --allow-download.   No font or file needed: the mark is a Shape. Written for Video Monk. -->
<vm-lib name="three"></vm-lib>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const GROUND = 0x0b1020, BODY = 0x4cc9f0, ACCENT = 0xffffff;                              // from MOTION.md
// The mark: a rounded square with a play triangle cut out. Change these points (a closed outline, then optional holes) to your own mark.
const OUTER = (() => { const s = new THREE.Shape(), r = 0.28, a = 1; s.moveTo(-a + r, -a); s.lineTo(a - r, -a); s.quadraticCurveTo(a, -a, a, -a + r); s.lineTo(a, a - r); s.quadraticCurveTo(a, a, a - r, a); s.lineTo(-a + r, a); s.quadraticCurveTo(-a, a, -a, a - r); s.lineTo(-a, -a + r); s.quadraticCurveTo(-a, -a, -a + r, -a); return s; })();
const HOLE = (() => { const h = new THREE.Path(); h.moveTo(-0.32, -0.5); h.lineTo(0.55, 0); h.lineTo(-0.32, 0.5); h.closePath(); return h; })();
OUTER.holes.push(HOLE);
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(GROUND);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(35, W / H, 0.1, 100); camera.position.set(0, 0, 7.5);
const geo = new THREE.ExtrudeGeometry(OUTER, { depth: 0.55, bevelEnabled: true, bevelThickness: 0.1, bevelSize: 0.08, bevelSegments: 6, curveSegments: 24 }); geo.center();
const mat = new THREE.MeshPhysicalMaterial({ color: BODY, metalness: 0.55, roughness: 0.22, clearcoat: 1, clearcoatRoughness: 0.12 });
const mark = new THREE.Mesh(geo, mat); scene.add(mark);
const key = new THREE.PointLight(ACCENT, 0, 30); scene.add(key);                         // the light that runs across the bevel
const fill = new THREE.DirectionalLight(0xffffff, 0.8); fill.position.set(-3, 2, 4); scene.add(fill);
const ease = x => 1 - Math.pow(1 - x, 3), back = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }, p = (t, a, d) => Math.min(1, Math.max(0, (t - a) / d));
window.__seek = t => {
  const flip = back(p(t, 0.1, 0.9));
  mark.rotation.y = (1 - flip) * Math.PI * 1.5 + Math.sin(t * 0.6) * 0.12 * p(t, 1.2, 0.6);
  mark.rotation.x = Math.sin(t * 0.5) * 0.06 * p(t, 1.2, 0.6);
  const grow = 0.4 + 0.6 * ease(p(t, 0.1, 0.7)); mark.scale.setScalar(grow); mat.opacity = 1;
  const sweep = p(t, 1.1, 1.3);                                                          // the glint travels left to right once
  key.position.set(-4 + sweep * 8, 1.6, 2.6); key.intensity = Math.sin(Math.PI * sweep) * 90;
  renderer.render(scene, camera);
};
window.__seek(0); window.__vmReady = true;
</script></body></html>
